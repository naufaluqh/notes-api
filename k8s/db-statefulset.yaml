apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notes-db
  namespace: notes
  labels:
    app.kubernetes.io/name: notes-db
spec:
  serviceName: notes-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user in alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-secret
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
            - mountPath: /var/run/postgresql
              name: postgres-run
            - mountPath: /tmp
              name: tmp-dir
      volumes:
        - name: postgres-run
          emptyDir: {}
        - name: tmp-dir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
