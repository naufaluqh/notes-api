version: 2
updates:
  # Node.js dependencies (package.json and package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      # Pull request titles must follow Conventional Commits (enforced by CI),
      # so Dependabot titles look like "build(deps): bump ...".
      prefix: "build"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"

  # GitHub Actions pinned by commit hash
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    commit-message:
      prefix: "build"
      include: "scope"

  # Images used in docker-compose.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    commit-message:
      prefix: "build"
      include: "scope"
