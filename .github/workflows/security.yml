name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # New vulnerabilities are published every day, so also scan weekly (Monday 02:00 UTC)
  # even when nobody opens a pull request.
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the full git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact -v

  dependency-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  image-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --pull -t notes-api:scan .

      - name: Save the image to a file
        run: docker save notes-api:scan -o "$RUNNER_TEMP/image.tar"

      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 1
