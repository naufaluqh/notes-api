name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow token may only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notes_app
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes_app -d notes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway credentials: this database only lives while the job runs.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: notes_app
      POSTGRES_PASSWORD: ci-only-throwaway-password
      POSTGRES_DB: notes_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create a throwaway .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=notes_app
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=notes
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF

      - name: Build the image and start the stack
        run: docker compose up -d --build --wait

      - name: Run the database migrations inside the container
        run: docker compose exec -T api node db/migrate.js

      - name: Smoke test the API
        run: |
          curl --fail --silent --show-error http://localhost:3000/ready
          curl --fail --silent --show-error -X POST http://localhost:3000/notes \
            -H "Content-Type: application/json" -d '{"title":"ci smoke test"}'
          curl --fail --silent --show-error http://localhost:3000/notes

      - name: Show container logs when something failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
