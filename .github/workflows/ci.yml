name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the workflow token may only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notes_app
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes_app -d notes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway credentials: this database only lives while the job runs.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: notes_app
      POSTGRES_PASSWORD: ci-only-throwaway-password
      POSTGRES_DB: notes_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
